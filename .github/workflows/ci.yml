name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run kb:lint

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_test
        ports:
          - 5455:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://agent:agent@localhost:5455/agent_test
      TEST_DATABASE_URL: postgres://agent:agent@localhost:5455/agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npm run ingest
      - run: npm run eval:retrieval -- --min-hit3 0.9

  # Builds the images and boots the whole stack (no LLM: the checks below never reach a model).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write throwaway secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 32)" >> .env
          echo "MCP_TOKEN_SECRET=$(openssl rand -base64 32)" >> .env
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke test
        run: |
          set -eux
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/api/chat -d '{}')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3333/mcp)" = 401
          token=$(docker compose exec -T mcp node --import tsx packages/mcp-server/src/mint-token.ts maya@brightpixelstudio.example | tail -1)
          curl -sf localhost:3333/mcp -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"lookup_order","arguments":{"orderId":"ORD-1042"}}}' \
            | grep -q 'Priority support'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
